<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Tracker — Browser History Telemetry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-border: #1e293b;
      --hover-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-emerald: #10b981;
      --accent-cyan: #06b6d4;
      --accent-purple: #a855f7;
      --accent-amber: #f59e0b;
      --accent-blue: #3b82f6;
      --bar-bg: rgba(6, 182, 212, 0.45);
      --bar-hover: #06b6d4;
      --bar-selected: #10b981;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header */
    header {
      background-color: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #06b6d4 0%, #a855f7 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      box-shadow: 0 0 16px rgba(6, 182, 212, 0.3);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 500;
      padding: 2px 6px;
      background: #1e293b;
      border-radius: 4px;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .badge-latency {
      font-family: var(--font-mono);
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    /* Main Container */
    main {
      flex: 1;
      padding: 16px 20px 40px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Controls Panel */
    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-box {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      color: var(--text-dim);
      pointer-events: none;
      width: 16px;
      height: 16px;
    }

    .search-input {
      width: 100%;
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      padding: 10px 36px 10px 38px;
      transition: all 0.15s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2);
    }

    .search-clear {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      display: none;
      padding: 4px;
    }

    .search-clear:hover {
      color: var(--text);
    }

    .filters-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
    }

    .filters-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    /* Day Navigator */
    .day-stepper {
      display: flex;
      align-items: center;
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      overflow: hidden;
    }

    .step-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 10px;
      cursor: pointer;
      transition: background 0.1s;
      font-size: 12px;
    }

    .step-btn:hover:not(:disabled) {
      background: var(--hover-bg);
      color: var(--text);
    }

    .step-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .day-select {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 12px;
      padding: 6px 10px;
      border-left: 1px solid var(--card-border);
      border-right: 1px solid var(--card-border);
      cursor: pointer;
      outline: none;
    }

    .day-select option {
      background: var(--card-bg);
      color: var(--text);
    }

    /* Browser Filter Chips */
    .browser-group {
      display: flex;
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      overflow: hidden;
      padding: 2px;
    }

    .chip-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chip-btn:hover {
      color: var(--text);
    }

    .chip-btn.active {
      background: #1e293b;
      color: #38bdf8;
      font-weight: 600;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-zen { background-color: var(--accent-purple); }
    .dot-chrome { background-color: var(--accent-amber); }
    .dot-chromium { background-color: var(--accent-cyan); }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-reset:hover {
      color: var(--text);
      border-color: var(--text-dim);
    }

    /* Active filter badges */
    .active-pills {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .filter-pill {
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.3);
      color: var(--accent-cyan);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-pill .remove-pill {
      cursor: pointer;
      opacity: 0.7;
    }
    .filter-pill .remove-pill:hover {
      opacity: 1;
    }

    /* Histogram Panel */
    .histogram-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .histogram-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .histogram-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .histogram-title {
      font-weight: 700;
      color: var(--text);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hist-breadcrumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }

    .crumb-btn {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--accent-cyan);
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.12s;
    }

    .crumb-btn:hover {
      background: #334155;
      color: #fff;
    }

    .crumb-sep {
      color: var(--text-dim);
      font-size: 11px;
    }

    .crumb-current {
      color: var(--text);
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }

    .histogram-stats {
      font-family: var(--font-mono);
      color: var(--text-dim);
      font-size: 11px;
    }

    /* Toolbar: Range and Interval */
    .histogram-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 11px;
    }

    .hist-toolbar-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .hist-controls-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hist-toolbar-label {
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 500;
    }

    .hist-pill-group {
      display: flex;
      background: #111827;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .hist-pill-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
    }

    .hist-pill-btn:hover:not(:disabled) {
      color: var(--text);
      background: var(--hover-bg);
    }

    .hist-pill-btn.active {
      background: #0284c7;
      color: #fff;
      font-weight: 600;
      box-shadow: 0 0 8px rgba(2, 132, 199, 0.4);
    }

    .hist-pill-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .hist-divider {
      width: 1px;
      height: 18px;
      background: var(--card-border);
    }

    .hist-scope-info {
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 10.5px;
    }

    /* Chart Container */
    .histogram-chart-container {
      position: relative;
      height: 100px;
      width: 100%;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      padding-top: 10px;
      padding-bottom: 22px;
      background: #070a12;
      border: 1px solid rgba(30, 41, 59, 0.6);
      border-radius: 8px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .hist-bar-col {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      position: relative;
      cursor: pointer;
      transition: background 0.1s;
    }

    .hist-bar-col:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .hist-bar {
      width: 100%;
      max-width: 28px;
      background: var(--bar-bg);
      border-top: 2px solid var(--accent-cyan);
      border-radius: 2px 2px 0 0;
      transition: background 0.15s, height 0.3s ease;
      min-height: 2px;
    }

    /* Zero-count bar on continuous timeline */
    .hist-bar-col.zero-bar .hist-bar {
      background: rgba(148, 163, 184, 0.15);
      border-top: 1px solid rgba(148, 163, 184, 0.3);
      height: 2px !important;
      min-height: 2px;
    }

    .hist-bar-col.zero-bar:hover .hist-bar {
      background: rgba(6, 182, 212, 0.4);
      border-top: 2px solid #06b6d4;
    }

    .hist-bar-col:hover .hist-bar:not(.hist-bar-col.zero-bar .hist-bar) {
      background: var(--bar-hover);
      filter: brightness(1.2);
    }

    .hist-bar-col.selected .hist-bar {
      background: var(--bar-selected) !important;
      border-top-color: #34d399 !important;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    .hist-bar-label {
      position: absolute;
      bottom: 3px;
      font-size: 9.5px;
      color: #94a3b8;
      font-weight: 500;
      font-family: var(--font-mono);
      white-space: nowrap;
      pointer-events: none;
      z-index: 5;
    }

    /* Custom Tooltip */
    .hist-tooltip {
      position: absolute;
      background: #090d16;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-family: var(--font-mono);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -100%);
      transition: opacity 0.1s ease;
      z-index: 100;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
    }

    /* Log Stream Table */
    .stream-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .stream-header {
      background: #0c1220;
      padding: 10px 16px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    .stream-count {
      font-weight: 600;
      color: var(--text);
    }

    .stream-list {
      display: flex;
      flex-direction: column;
      divide-y: 1px solid var(--card-border);
    }

    .stream-row {
      display: grid;
      grid-template-columns: 140px 28px 180px 1fr 40px;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      border-bottom: 1px solid rgba(30, 41, 59, 0.6);
      transition: background 0.1s;
      font-size: 12px;
    }

    .stream-row:hover {
      background: var(--hover-bg);
    }

    .col-time {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .col-source {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .browser-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      transition: transform 0.12s ease;
      cursor: pointer;
    }

    .browser-icon:hover {
      transform: scale(1.2);
    }

    .badge-zen {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .badge-chrome {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .badge-chromium {
      background: rgba(6, 182, 212, 0.15);
      color: #22d3ee;
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .col-domain {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .domain-tag {
      background: #1e293b;
      color: #cbd5e1;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .domain-tag:hover {
      background: #334155;
      color: #fff;
    }

    .col-title-url {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .page-title {
      font-weight: 600;
      color: #e2e8f0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12.5px;
    }

    .page-url {
      color: var(--text-dim);
      font-size: 11px;
      font-family: var(--font-mono);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-decoration: none;
    }

    .page-url:hover {
      color: var(--accent-cyan);
      text-decoration: underline;
    }

    .col-action {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 5px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
    }

    .btn-icon:hover {
      background: #334155;
      color: #fff;
    }

    .highlight {
      background: rgba(245, 158, 11, 0.25);
      color: #fde68a;
      padding: 0 2px;
      border-radius: 2px;
    }

    /* Load more button */
    .stream-footer {
      padding: 14px;
      text-align: center;
      background: #0c1220;
      border-top: 1px solid var(--card-border);
    }

    .btn-load-more {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      padding: 8px 24px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-load-more:hover {
      background: #334155;
      border-color: var(--accent-cyan);
    }

    /* Empty state */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .empty-icon {
      font-size: 32px;
      opacity: 0.6;
    }

    /* Loading Spinner */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top-color: var(--accent-cyan);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mobile adjustments */
    @media (max-width: 900px) {
      .stream-row {
        grid-template-columns: 75px 60px 1fr 35px;
      }
      .col-domain {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">🌐</div>
      <div>
        <div class="brand-title">
          Network Tracker
          <span class="brand-subtitle">Web History</span>
        </div>
      </div>
    </div>

    <div class="header-status">
      <span id="clickhouseStatus">Łączenie z ClickHouse...</span>
      <span class="badge-latency" id="latencyBadge">⚡ -- ms</span>
    </div>
  </header>

  <!-- Main View -->
  <main>

    <!-- Controls & Search -->
    <div class="controls-panel">
      <div class="search-row">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="Szukaj po tytule strony, adresie URL lub domenie (np. github, praca magisterska, arxiv)..."
            autocomplete="off"
            spellcheck="false"
          >
          <button id="searchClear" class="search-clear" title="Wyczyść wyszukiwanie">✕</button>
        </div>
      </div>

      <div class="filters-row">
        <div class="filters-left">
          
          <!-- Journal Day Stepper -->
          <div class="day-stepper">
            <button id="btnPrevDay" class="step-btn" title="Poprzedni dzień">◀</button>
            <select id="daySelect" class="day-select">
              <option value="">Wszystkie dni</option>
            </select>
            <button id="btnNextDay" class="step-btn" title="Następny dzień">▶</button>
          </div>

          <!-- Browser selector -->
          <div class="browser-group">
            <button class="chip-btn active" data-source="all">Wszystkie</button>
            <button class="chip-btn" data-source="zen">
              <span class="dot dot-zen"></span>Zen
            </button>
            <button class="chip-btn" data-source="chrome">
              <span class="dot dot-chrome"></span>Chrome
            </button>
            <button class="chip-btn" data-source="chromium">
              <span class="dot dot-chromium"></span>Chromium
            </button>
          </div>

          <!-- Active filters (pills) -->
          <div id="activePills" class="active-pills"></div>
        </div>

        <div>
          <button id="btnResetFilters" class="btn-reset">Reset filtrów</button>
        </div>
      </div>
    </div>

    <!-- VictoriaLogs-style Continuous Histogram Panel -->
    <div class="histogram-panel">
      <div class="histogram-header">
        <div class="histogram-title-wrap">
          <span class="histogram-title">📊 Rozkład wystąpień w czasie</span>
          <div id="histBreadcrumbs" class="hist-breadcrumbs"></div>
        </div>
        <div class="histogram-stats" id="histStats">
          Ładowanie histogramu...
        </div>
      </div>

      <div class="histogram-toolbar">
        <div class="hist-toolbar-left">
          <div class="hist-controls-group">
            <span class="hist-toolbar-label">Zakres:</span>
            <div class="hist-pill-group" id="rangePills">
              <button class="hist-pill-btn" data-range="today">Dziś</button>
              <button class="hist-pill-btn" data-range="7d">7D</button>
              <button class="hist-pill-btn active" data-range="30d">30D</button>
              <button class="hist-pill-btn" data-range="1y">1R</button>
              <button class="hist-pill-btn" data-range="all">Wszystko</button>
            </div>
          </div>

          <div class="hist-divider"></div>

          <div class="hist-controls-group">
            <span class="hist-toolbar-label">Grupowanie:</span>
            <div class="hist-pill-group" id="intervalPills">
              <button class="hist-pill-btn active" data-interval="auto">Auto</button>
              <button class="hist-pill-btn" data-interval="hourly">Godzina</button>
              <button class="hist-pill-btn" data-interval="6h">6h</button>
              <button class="hist-pill-btn" data-interval="daily">Dzień</button>
              <button class="hist-pill-btn" data-interval="monthly">Miesiąc</button>
            </div>
          </div>
        </div>

        <div class="hist-scope-info" id="histScopeInfo"></div>
      </div>

      <div class="histogram-chart-container" id="histogramContainer">
        <!-- Bars injected dynamically -->
      </div>
    </div>

    <!-- Stream / Table Panel -->
    <div class="stream-panel">
      <div class="stream-header">
        <div>
          <span class="stream-count" id="resultsCount">0 wyników</span>
          <span id="filterDescription" style="color:var(--text-dim); margin-left:8px;"></span>
        </div>
        <div id="paginationInfo">
          Strona 1
        </div>
      </div>

      <div class="stream-list" id="streamList">
        <!-- Log rows injected dynamically -->
      </div>

      <div class="stream-footer" id="streamFooter" style="display:none;">
        <button id="btnLoadMore" class="btn-load-more">Załaduj więcej wpisów</button>
      </div>
    </div>

  </main>

  <!-- Tooltip element -->
  <div id="histTooltip" class="hist-tooltip"></div>

  <script>
    const MONTH_NAMES_PL = [
      'Styczeń', 'Luty', 'Marzec', 'Kwiecień', 'Maj', 'Czerwiec',
      'Lipiec', 'Sierpień', 'Wrzesień', 'Październik', 'Listopad', 'Grudzień'
    ];
    const WEEKDAY_NAMES_PL = [
      'Poniedziałek', 'Wtorek', 'Środa', 'Czwartek', 'Piątek', 'Sobota', 'Niedziela'
    ];

    // State
    const state = {
      q: '',
      range: '30d',
      interval: 'auto',
      month: '',
      day: '',
      hour: '',
      source: 'all',
      domain: '',
      offset: 0,
      limit: 100,
      total: 0,
      hasMore: false,
      loading: false,
      daysList: []
    };

    let debounceTimer = null;

    // Elements
    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');
    const daySelect = document.getElementById('daySelect');
    const btnPrevDay = document.getElementById('btnPrevDay');
    const btnNextDay = document.getElementById('btnNextDay');
    const activePills = document.getElementById('activePills');
    const btnResetFilters = document.getElementById('btnResetFilters');
    const histogramContainer = document.getElementById('histogramContainer');
    const histStats = document.getElementById('histStats');
    const histBreadcrumbs = document.getElementById('histBreadcrumbs');
    const histScopeInfo = document.getElementById('histScopeInfo');
    const histTooltip = document.getElementById('histTooltip');
    const streamList = document.getElementById('streamList');
    const resultsCount = document.getElementById('resultsCount');
    const latencyBadge = document.getElementById('latencyBadge');
    const clickhouseStatus = document.getElementById('clickhouseStatus');
    const streamFooter = document.getElementById('streamFooter');
    const btnLoadMore = document.getElementById('btnLoadMore');
    const paginationInfo = document.getElementById('paginationInfo');

    // Init
    async function init() {
      setupEventListeners();
      await loadDays();
      await executeQuery(true);
    }

    function setupEventListeners() {
      // Search input debounced
      searchInput.addEventListener('input', (e) => {
        state.q = e.target.value.trim();
        searchClear.style.display = state.q ? 'block' : 'none';
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          state.offset = 0;
          state.hour = ''; // clear specific hour on new query
          executeQuery(true);
        }, 250);
      });

      // Clear search
      searchClear.addEventListener('click', () => {
        searchInput.value = '';
        state.q = '';
        searchClear.style.display = 'none';
        state.offset = 0;
        executeQuery(true);
      });

      // Day selector change
      daySelect.addEventListener('change', (e) => {
        state.day = e.target.value;
        state.month = '';
        state.hour = '';
        state.offset = 0;
        updateDayStepperButtons();
        updatePillButtonsUI();
        executeQuery(true);
      });

      // Day stepper
      btnPrevDay.addEventListener('click', () => stepDay(1)); // older day
      btnNextDay.addEventListener('click', () => stepDay(-1)); // newer day

      // Browser buttons
      document.querySelectorAll('.chip-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.source = btn.dataset.source;
          state.offset = 0;
          executeQuery(true);
        });
      });

      // Range pills
      document.querySelectorAll('#rangePills .hist-pill-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.range = btn.dataset.range;
          state.day = '';
          state.month = '';
          state.hour = '';
          state.offset = 0;
          daySelect.value = '';
          updateDayStepperButtons();
          updatePillButtonsUI();
          executeQuery(true);
        });
      });

      // Interval pills
      document.querySelectorAll('#intervalPills .hist-pill-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.interval = btn.dataset.interval;
          state.offset = 0;
          updatePillButtonsUI();
          executeQuery(true);
        });
      });

      // Reset filters
      btnResetFilters.addEventListener('click', () => {
        state.q = '';
        state.range = '30d';
        state.interval = 'auto';
        state.month = '';
        state.day = '';
        state.hour = '';
        state.source = 'all';
        state.domain = '';
        state.offset = 0;
        searchInput.value = '';
        searchClear.style.display = 'none';
        daySelect.value = '';
        document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.chip-btn[data-source="all"]').classList.add('active');
        updateDayStepperButtons();
        updatePillButtonsUI();
        executeQuery(true);
      });

      // Load more
      btnLoadMore.addEventListener('click', () => {
        if (!state.loading && state.hasMore) {
          state.offset += state.limit;
          executeQuery(false);
        }
      });
    }

    function getApiUrl(endpoint) {
      const base = window.location.pathname.startsWith('/network') ? '/network' : '';
      return `${base}${endpoint}`;
    }

    async function loadDays() {
      try {
        const res = await fetch(getApiUrl('/api/days'));
        const data = await res.json();
        if (data.days) {
          state.daysList = data.days;
          daySelect.innerHTML = '<option value="">Wszystkie dni (Pełna historia)</option>';
          data.days.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.day;
            opt.textContent = `${d.day} (${d.count.toLocaleString()} wizyt)`;
            daySelect.appendChild(opt);
          });
        }
      } catch (e) {
        console.error('Failed to load days:', e);
      }
    }

    function stepDay(delta) {
      if (!state.daysList.length) return;
      const currentIndex = state.daysList.findIndex(d => d.day === state.day);
      let newIndex;
      if (currentIndex === -1) {
        newIndex = delta > 0 ? 0 : 0;
      } else {
        newIndex = currentIndex + delta;
      }

      if (newIndex >= 0 && newIndex < state.daysList.length) {
        state.day = state.daysList[newIndex].day;
        state.month = '';
        daySelect.value = state.day;
        state.hour = '';
        state.offset = 0;
        updateDayStepperButtons();
        updatePillButtonsUI();
        executeQuery(true);
      } else if (newIndex < 0) {
        state.day = '';
        state.month = '';
        daySelect.value = '';
        state.hour = '';
        state.offset = 0;
        updateDayStepperButtons();
        updatePillButtonsUI();
        executeQuery(true);
      }
    }

    function updateDayStepperButtons() {
      const idx = state.daysList.findIndex(d => d.day === state.day);
      btnNextDay.disabled = (idx <= 0 && state.day !== '');
      btnPrevDay.disabled = (idx >= state.daysList.length - 1);
    }

    function formatMonthName(ymStr) {
      if (!ymStr || !ymStr.includes('-')) return ymStr;
      const parts = ymStr.split('-');
      const y = parts[0];
      const m = parseInt(parts[1], 10);
      const mName = MONTH_NAMES_PL[m - 1] || parts[1];
      return `${mName} ${y}`;
    }

    function updatePillButtonsUI(activeMode) {
      // Update Range pills
      document.querySelectorAll('#rangePills .hist-pill-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.range === state.range && !state.day && !state.month);
      });

      // Update Interval pills
      document.querySelectorAll('#intervalPills .hist-pill-btn').forEach(btn => {
        const isExplicit = (btn.dataset.interval === state.interval);
        const isAutoActive = (state.interval === 'auto' && (
          (btn.dataset.interval === 'auto') ||
          (btn.dataset.interval === activeMode)
        ));
        btn.classList.toggle('active', isExplicit || (btn.dataset.interval === 'auto' && state.interval === 'auto'));

        // Disable hourly if broad range without single day
        if (btn.dataset.interval === 'hourly') {
          btn.disabled = (state.range === 'all' || state.range === '1y' || state.range === '90d') && !state.day;
        } else if (btn.dataset.interval === '6h') {
          btn.disabled = (state.range === 'all' || state.range === '1y') && !state.day;
        } else {
          btn.disabled = false;
        }
      });
    }

    function renderBreadcrumbs(histData) {
      histBreadcrumbs.innerHTML = '';

      const rangeLabels = {
        today: 'Dziś',
        '7d': '7D',
        '30d': '30D',
        '1y': '1R',
        all: 'Wszystko'
      };
      const rangeName = rangeLabels[state.range] || state.range;

      if (!state.day && !state.month) {
        const current = document.createElement('span');
        current.className = 'crumb-current';
        current.textContent = rangeName;
        histBreadcrumbs.appendChild(current);
        return;
      }

      // Root crumb
      const rootBtn = document.createElement('button');
      rootBtn.className = 'crumb-btn';
      rootBtn.textContent = rangeName;
      rootBtn.title = `Wróć do: ${rangeName}`;
      rootBtn.addEventListener('click', () => {
        state.day = '';
        state.month = '';
        state.hour = '';
        state.offset = 0;
        daySelect.value = '';
        updateDayStepperButtons();
        updatePillButtonsUI();
        executeQuery(true);
      });
      histBreadcrumbs.appendChild(rootBtn);

      if (state.month) {
        const sep = document.createElement('span');
        sep.className = 'crumb-sep';
        sep.textContent = '›';
        histBreadcrumbs.appendChild(sep);

        if (state.day) {
          const mBtn = document.createElement('button');
          mBtn.className = 'crumb-btn';
          mBtn.textContent = formatMonthName(state.month);
          mBtn.addEventListener('click', () => {
            state.day = '';
            state.hour = '';
            state.offset = 0;
            daySelect.value = '';
            updateDayStepperButtons();
            updatePillButtonsUI();
            executeQuery(true);
          });
          histBreadcrumbs.appendChild(mBtn);
        } else {
          const mCur = document.createElement('span');
          mCur.className = 'crumb-current';
          mCur.textContent = formatMonthName(state.month);
          histBreadcrumbs.appendChild(mCur);
        }
      }

      if (state.day) {
        const sep = document.createElement('span');
        sep.className = 'crumb-sep';
        sep.textContent = '›';
        histBreadcrumbs.appendChild(sep);

        const dCur = document.createElement('span');
        dCur.className = 'crumb-current';
        dCur.textContent = state.day;
        histBreadcrumbs.appendChild(dCur);
      }
    }

    function renderActivePills() {
      activePills.innerHTML = '';

      if (state.month) {
        const pill = document.createElement('span');
        pill.className = 'filter-pill';
        pill.innerHTML = `Miesiąc: <strong>${escapeHtml(formatMonthName(state.month))}</strong> <span class="remove-pill" title="Usuń filtr">✕</span>`;
        pill.querySelector('.remove-pill').addEventListener('click', () => {
          state.month = '';
          state.offset = 0;
          executeQuery(true);
        });
        activePills.appendChild(pill);
      }

      if (state.day) {
        const pill = document.createElement('span');
        pill.className = 'filter-pill';
        pill.innerHTML = `Dzień: <strong>${escapeHtml(state.day)}</strong> <span class="remove-pill" title="Usuń filtr">✕</span>`;
        pill.querySelector('.remove-pill').addEventListener('click', () => {
          state.day = '';
          state.hour = '';
          state.offset = 0;
          daySelect.value = '';
          updateDayStepperButtons();
          executeQuery(true);
        });
        activePills.appendChild(pill);
      }

      if (state.domain) {
        const pill = document.createElement('span');
        pill.className = 'filter-pill';
        pill.innerHTML = `Domena: <strong>${escapeHtml(state.domain)}</strong> <span class="remove-pill" title="Usuń filtr">✕</span>`;
        pill.querySelector('.remove-pill').addEventListener('click', () => {
          state.domain = '';
          state.offset = 0;
          executeQuery(true);
        });
        activePills.appendChild(pill);
      }

      if (state.hour) {
        const pill = document.createElement('span');
        pill.className = 'filter-pill';
        pill.innerHTML = `Godzina: <strong>${escapeHtml(state.hour)}</strong> <span class="remove-pill" title="Usuń filtr">✕</span>`;
        pill.querySelector('.remove-pill').addEventListener('click', () => {
          state.hour = '';
          state.offset = 0;
          executeQuery(true);
        });
        activePills.appendChild(pill);
      }
    }

    async function executeQuery(resetStream = true) {
      if (state.loading) return;
      state.loading = true;

      renderActivePills();

      if (resetStream) {
        streamList.innerHTML = '<div class="empty-state"><span class="spinner"></span> Odpytywanie ClickHouse...</div>';
      }

      // Build params
      const params = new URLSearchParams();
      if (state.q) params.set('q', state.q);
      if (state.day) params.set('day', state.day);
      if (state.month) params.set('month', state.month);
      if (state.hour) params.set('hour', state.hour);
      if (state.range) params.set('range', state.range);
      if (state.interval) params.set('interval', state.interval);
      if (state.source !== 'all') params.set('source', state.source);
      if (state.domain) params.set('domain', state.domain);
      params.set('limit', state.limit);
      params.set('offset', state.offset);

      try {
        // Run history & histogram in parallel
        const historyPromise = fetch(getApiUrl(`/api/history?${params.toString()}`)).then(r => r.json());
        const histParams = new URLSearchParams(params);
        histParams.delete('hour'); // Histogram always shows the full timeline
        const histPromise = resetStream ? fetch(getApiUrl(`/api/histogram?${histParams.toString()}`)).then(r => r.json()) : Promise.resolve(null);

        const [historyData, histData] = await Promise.all([historyPromise, histPromise]);

        // Render latency & status
        latencyBadge.textContent = `⚡ ${historyData.took_ms || 0} ms`;
        clickhouseStatus.textContent = `ClickHouse OK`;

        // Render histogram if refreshed
        if (histData) {
          renderHistogram(histData);
        }

        // Render rows
        state.total = historyData.total || 0;
        state.hasMore = historyData.has_more || false;
        resultsCount.textContent = `${state.total.toLocaleString()} wizyt`;

        const showingTo = Math.min(state.offset + (historyData.rows ? historyData.rows.length : 0), state.total);
        paginationInfo.textContent = state.total > 0 ? `Wpisy ${state.offset + 1}–${showingTo} z ${state.total.toLocaleString()}` : '';

        if (resetStream) {
          streamList.innerHTML = '';
        }

        if (!historyData.rows || historyData.rows.length === 0) {
          if (resetStream) {
            streamList.innerHTML = `
              <div class="empty-state">
                <div class="empty-icon">🔍</div>
                <div>Brak zarejestrowanych stron dla wybranych kryteriów.</div>
                <div style="font-size:11px; color:var(--text-dim);">Spróbuj zmienić zapytanie, wybrać inny zakres lub zresetować filtry.</div>
              </div>
            `;
          }
        } else {
          historyData.rows.forEach(row => {
            const el = createRowElement(row);
            streamList.appendChild(el);
          });
        }

        streamFooter.style.display = state.hasMore ? 'block' : 'none';

      } catch (err) {
        console.error('Fetch error:', err);
        streamList.innerHTML = `<div class="empty-state" style="color:var(--accent-amber);">❌ Błąd pobierania danych: ${escapeHtml(err.message)}</div>`;
        clickhouseStatus.textContent = 'Błąd ClickHouse';
      } finally {
        state.loading = false;
      }
    }

    function renderHistogram(data) {
      histogramContainer.innerHTML = '';
      if (!data || !data.buckets || data.buckets.length === 0) {
        histStats.textContent = 'Brak danych do wykresu';
        return;
      }

      renderBreadcrumbs(data);
      updatePillButtonsUI(data.bucket_mode);

      const isHourly = (data.bucket_mode === 'hourly');
      const is6h = (data.bucket_mode === '6h');
      const isDaily = (data.bucket_mode === 'daily');
      const isMonthly = (data.bucket_mode === 'monthly');

      const modeDescriptions = {
        hourly: `Godzinowy (${state.day || 'Dziś'})`,
        '6h': `6-godzinowy (7×4 = 28 słupków)`,
        daily: state.month ? `Dzienny dla ${formatMonthName(state.month)}` : 'Dzienny',
        monthly: 'Miesięczny'
      };
      const modeText = modeDescriptions[data.bucket_mode] || data.bucket_mode;

      histScopeInfo.textContent = `Tryb: ${modeText} | Słupków: ${data.buckets.length}`;
      histStats.textContent = `Suma: ${data.total.toLocaleString()} wizyt | Pik: ${data.max.toLocaleString()} w ${data.took_ms} ms`;

      const maxVal = Math.max(data.max, 1);
      const totalBuckets = data.buckets.length;

      // Adjust column gap
      if (totalBuckets <= 35) {
        histogramContainer.style.gap = '3px';
      } else if (totalBuckets <= 100) {
        histogramContainer.style.gap = '2px';
      } else {
        histogramContainer.style.gap = '1px';
      }

      data.buckets.forEach((b, idx) => {
        const col = document.createElement('div');
        col.className = 'hist-bar-col';
        const isZero = (b.count === 0);
        if (isZero) {
          col.classList.add('zero-bar');
        }

        // Selection highlight
        if (isHourly) {
          if (state.hour === b.bucket) col.classList.add('selected');
        } else if (is6h) {
          if (state.day === b.day) col.classList.add('selected');
        } else if (isDaily) {
          if (state.day === b.bucket) col.classList.add('selected');
        } else if (isMonthly) {
          if (state.month === b.bucket) col.classList.add('selected');
        }

        const heightPct = isZero ? 0 : Math.max(Math.round((b.count / maxVal) * 100), 4);

        const bar = document.createElement('div');
        bar.className = 'hist-bar';
        if (!isZero) {
          bar.style.height = `${heightPct}%`;
        }
        col.appendChild(bar);

        // Smart timeline labels
        let showLabel = false;
        let labelText = '';

        if (isHourly) {
          showLabel = (idx % 3 === 0) || (idx === totalBuckets - 1);
          labelText = b.bucket;
        } else if (is6h) {
          // Add subtle day separator before first 6h bar (00:00) of each day
          if (b.hour === 0 && idx > 0) {
            col.style.borderLeft = '1px solid rgba(255, 255, 255, 0.14)';
          }
          if (b.hour === 0) {
            showLabel = true;
            const wDay = (b.weekday !== undefined && WEEKDAY_NAMES_PL[b.weekday]) ? WEEKDAY_NAMES_PL[b.weekday].slice(0, 2) : '';
            labelText = `${b.day.slice(5)} (${wDay})`;
          }
        } else if (isMonthly) {
          showLabel = (totalBuckets <= 12) || (idx % 2 === 0) || (idx === totalBuckets - 1);
          labelText = b.bucket; // YYYY-MM
        } else if (isDaily) {
          if (totalBuckets <= 10) {
            showLabel = true;
            labelText = b.bucket.slice(5); // MM-DD
          } else if (totalBuckets <= 35) {
            showLabel = (idx % 5 === 0) || (idx === totalBuckets - 1);
            labelText = b.bucket.slice(5);
          } else if (totalBuckets <= 100) {
            showLabel = (idx % 10 === 0) || (idx === totalBuckets - 1);
            labelText = b.bucket.slice(5);
          } else {
            showLabel = b.bucket.endsWith('-01') || (idx === 0) || (idx === totalBuckets - 1);
            labelText = b.bucket.slice(2, 7); // YY-MM
          }
        }

        if (showLabel) {
          const label = document.createElement('span');
          label.className = 'hist-bar-label';
          label.textContent = labelText;
          col.appendChild(label);
        }

        // Tooltip
        let tooltipTitle = b.bucket;
        if (isHourly) {
          tooltipTitle = `${b.day || state.day || 'Dziś'} ${b.bucket}`;
        } else if (is6h) {
          const wDay = (b.weekday !== undefined && WEEKDAY_NAMES_PL[b.weekday]) ? ` (${WEEKDAY_NAMES_PL[b.weekday]})` : '';
          tooltipTitle = `${b.day}${wDay} ${b.interval_label || b.label}`;
        } else if (isDaily) {
          const wDay = (b.weekday !== undefined && WEEKDAY_NAMES_PL[b.weekday]) ? ` (${WEEKDAY_NAMES_PL[b.weekday]})` : '';
          tooltipTitle = `${b.bucket}${wDay}`;
        } else if (isMonthly) {
          tooltipTitle = formatMonthName(b.bucket);
        }

        col.addEventListener('mouseenter', () => {
          histTooltip.innerHTML = `<strong>${tooltipTitle}</strong>: ${b.count.toLocaleString()} wizyt`;
          histTooltip.style.opacity = '1';
          const rect = col.getBoundingClientRect();
          histTooltip.style.left = `${rect.left + rect.width / 2}px`;
          histTooltip.style.top = `${rect.top - 8}px`;
        });

        col.addEventListener('mouseleave', () => {
          histTooltip.style.opacity = '0';
        });

        // Click drill-down / filter
        col.addEventListener('click', () => {
          if (isMonthly) {
            // Zoom into clicked month
            state.month = b.bucket;
            state.day = '';
            state.hour = '';
            state.interval = 'daily';
            state.offset = 0;
            executeQuery(true);
          } else if (is6h) {
            // Zoom into clicked day
            state.day = b.day;
            state.hour = '';
            state.interval = 'hourly';
            state.offset = 0;
            daySelect.value = state.day;
            updateDayStepperButtons();
            executeQuery(true);
          } else if (isDaily) {
            // Zoom into clicked day
            state.day = b.bucket;
            state.hour = '';
            state.interval = 'hourly';
            state.offset = 0;
            daySelect.value = state.day;
            updateDayStepperButtons();
            executeQuery(true);
          } else if (isHourly) {
            // Toggle hour filter
            state.hour = (state.hour === b.bucket) ? '' : b.bucket;
            state.offset = 0;
            executeQuery(true);
          }
        });

        histogramContainer.appendChild(col);
      });
    }


    const BROWSER_SVGS = {
      zen: `<svg class="browser-icon" viewBox="0 0 24 24" width="20" height="20" title="Zen Browser">
        <circle cx="12" cy="12" r="10.5" fill="#241438" stroke="#a855f7" stroke-width="1.5"/>
        <path d="M12 3.5 A 8.5 8.5 0 0 1 12 20.5 A 4.25 4.25 0 0 1 12 12 A 4.25 4.25 0 0 0 12 3.5" fill="#a855f7"/>
        <circle cx="12" cy="7.8" r="1.6" fill="#f5f3ff"/>
        <circle cx="12" cy="16.2" r="1.6" fill="#241438"/>
      </svg>`,
      chrome: `<svg class="browser-icon" viewBox="0 0 24 24" width="20" height="20" title="Google Chrome">
        <circle cx="12" cy="12" r="10.5" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
        <circle cx="12" cy="12" r="9" fill="#EA4335"/>
        <path d="M12 3 A 9 9 0 0 1 19.8 7.5 L 12 7.5 Z" fill="#EA4335"/>
        <path d="M19.8 7.5 A 9 9 0 0 1 15 20.6 L 11 13.7 Z" fill="#FBBC05"/>
        <path d="M15 20.6 A 9 9 0 0 1 4.2 16.5 L 8.1 9.7 Z" fill="#34A853"/>
        <circle cx="12" cy="12" r="4.2" fill="#FFFFFF"/>
        <circle cx="12" cy="12" r="3.3" fill="#4285F4"/>
      </svg>`,
      chromium: `<svg class="browser-icon" viewBox="0 0 24 24" width="20" height="20" title="Chromium">
        <circle cx="12" cy="12" r="10.5" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
        <circle cx="12" cy="12" r="9" fill="#1976D2"/>
        <path d="M12 3 A 9 9 0 0 1 19.8 7.5 L 12 7.5 Z" fill="#2196F3"/>
        <path d="M19.8 7.5 A 9 9 0 0 1 15 20.6 L 11 13.7 Z" fill="#64B5F6"/>
        <path d="M15 20.6 A 9 9 0 0 1 4.2 16.5 L 8.1 9.7 Z" fill="#1E88E5"/>
        <circle cx="12" cy="12" r="4.2" fill="#FFFFFF"/>
        <circle cx="12" cy="12" r="3.3" fill="#0D47A1"/>
      </svg>`
    };

    function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise((resolve, reject) => {
        try {
          const textArea = document.createElement("textarea");
          textArea.value = text;
          textArea.style.position = "fixed";
          textArea.style.left = "-999999px";
          textArea.style.top = "-999999px";
          textArea.setAttribute("readonly", "");
          document.body.appendChild(textArea);
          textArea.select();
          const successful = document.execCommand("copy");
          textArea.remove();
          if (successful) resolve();
          else reject(new Error("Kopiowanie nie powiodło się"));
        } catch (err) {
          reject(err);
        }
      });
    }

    function createRowElement(row) {
      const div = document.createElement('div');
      div.className = 'stream-row';

      // Browser SVG Icon
      let srcKey = 'zen';
      let browserName = 'Zen Browser';
      if (row.source === 'chrome' || row.source === 'google-chrome') {
        srcKey = 'chrome';
        browserName = 'Google Chrome';
      } else if (row.source === 'chromium') {
        srcKey = 'chromium';
        browserName = 'Chromium';
      }
      const browserSvg = BROWSER_SVGS[srcKey] || BROWSER_SVGS.zen;

      // Display time: if day selected, just show HH:MM:SS
      const timeStr = state.day ? row.time : row.ts;
      const rawTitle = row.title || row.url || '(Bez tytułu)';
      const highlightedTitle = highlightMatch(rawTitle, state.q);
      const highlightedUrl = highlightMatch(row.url, state.q);

      div.innerHTML = `
        <div class="col-time" title="${escapeHtml(row.ts)}">${escapeHtml(timeStr)}</div>
        <div class="col-source" title="${browserName}">
          ${browserSvg}
        </div>
        <div class="col-domain">
          <span class="domain-tag" title="Kliknij, aby filtrować po ${escapeHtml(row.domain)}">${escapeHtml(row.domain || 'lokalne')}</span>
        </div>
        <div class="col-title-url">
          <div class="page-title" title="${escapeHtml(rawTitle)}">${highlightedTitle}</div>
          <a href="${escapeHtml(row.url)}" target="_blank" rel="noopener noreferrer" class="page-url" title="Otwórz stronę: ${escapeHtml(row.url)}">${highlightedUrl}</a>
        </div>
        <div class="col-action">
          <button class="btn-icon btn-copy" title="Skopiuj URL">📋</button>
        </div>
      `;

      // Filter by browser on icon click
      div.querySelector('.col-source').addEventListener('click', (e) => {
        e.stopPropagation();
        state.source = (state.source === srcKey) ? 'all' : srcKey;
        document.querySelectorAll('.chip-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.source === state.source);
        });
        state.offset = 0;
        executeQuery(true);
      });

      // Filter by domain on tag click
      div.querySelector('.domain-tag').addEventListener('click', (e) => {
        e.stopPropagation();
        if (row.domain) {
          state.domain = (state.domain === row.domain) ? '' : row.domain;
          state.offset = 0;
          executeQuery(true);
        }
      });

      // Copy URL with bulletproof fallback
      div.querySelector('.btn-copy').addEventListener('click', (e) => {
        e.stopPropagation();
        copyTextToClipboard(row.url).then(() => {
          const btn = div.querySelector('.btn-copy');
          btn.textContent = '✓';
          btn.style.color = 'var(--accent-emerald)';
          setTimeout(() => { 
            btn.textContent = '📋'; 
            btn.style.color = '';
          }, 1500);
        }).catch((err) => {
          console.error('Copy failed:', err);
        });
      });

      return div;
    }

    function highlightMatch(text, query) {
      if (!text) return '';
      if (!query) return escapeHtml(text);
      const terms = query.split(/\s+/).filter(Boolean);
      if (!terms.length) return escapeHtml(text);

      let escaped = escapeHtml(text);
      terms.forEach(term => {
        const regex = new RegExp(`(${escapeRegex(term)})`, 'gi');
        escaped = escaped.replace(regex, '<span class="highlight">$1</span>');
      });
      return escaped;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Launch
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
